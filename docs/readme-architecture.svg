<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Smart Traffic Monitoring workflow</title><desc id="desc">The Streamlit application processes a traffic video with YOLOv8 detection and DeepSORT tracking, then derives speed and wrong-way events for review.</desc><rect width="1200" height="400" rx="18" fill="#F3F4F1"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#4E7D64">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2A332D">Smart Traffic Monitoring</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6B766F">Video frames to vehicle tracking and event alerts</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D7DED8"/><path d="M 300 237 L 330 237" stroke="#6B766F" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6B766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6B766F" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6B766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6B766F" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6B766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7DED8" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#4E7D64"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4E7D64">01 / VIDEO</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2A332D">Upload traffic footage</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B766F">Read the input with OpenCV.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7DED8" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#C18A3A"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#C18A3A">02 / DETECT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2A332D">YOLOv8</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B766F">Find vehicle bounding boxes.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7DED8" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#5F8294"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F8294">03 / TRACK</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2A332D">DeepSORT</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B766F">Associate detections across frames.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7DED8" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#4E7D64"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4E7D64">04 / EVENTS</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2A332D">Speed + direction checks</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B766F">Display traffic events and records.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#4E7D64">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B766F">Speed thresholds need scene-specific calibration; this is not a certified enforcement system.</text></svg>