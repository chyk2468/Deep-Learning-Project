<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><rect width="1200" height="390" rx="18" fill="#F3F4F1"/><text x="56" y="42" fill="#4E7D64" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#2A332D" font-family="Arial,sans-serif" font-size="26" font-weight="700">Smart Traffic Monitoring</text><text x="56" y="108" fill="#6B766F" font-family="Arial,sans-serif" font-size="14">Detect and track vehicles in video, then estimate traffic events.</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#D7DED8"/><path d="M 288 236 H 334" stroke="#6B766F" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" stroke="#6B766F" fill="none"/><path d="M 576 236 H 622" stroke="#6B766F" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" stroke="#6B766F" fill="none"/><path d="M 864 236 H 910" stroke="#6B766F" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" stroke="#6B766F" fill="none"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D7DED8"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#4E7D64"/><text x="72" y="184" fill="#4E7D64" font-family="Arial,sans-serif" font-size="10" font-weight="700">VIDEO</text><text x="72" y="219" fill="#2A332D" font-family="Arial,sans-serif" font-size="15" font-weight="700">Traffic footage</text><text x="72" y="248" fill="#6B766F" font-family="Arial,sans-serif" font-size="11.5">Load the source video.</text><circle cx="260" cy="179" r="4" fill="#4E7D64"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D7DED8"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#C18A3A"/><text x="360" y="184" fill="#C18A3A" font-family="Arial,sans-serif" font-size="10" font-weight="700">DETECT</text><text x="360" y="219" fill="#2A332D" font-family="Arial,sans-serif" font-size="15" font-weight="700">YOLOv8</text><text x="360" y="248" fill="#6B766F" font-family="Arial,sans-serif" font-size="11.5">Find vehicles in each frame.</text><circle cx="548" cy="179" r="4" fill="#C18A3A"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D7DED8"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#5F8294"/><text x="648" y="184" fill="#5F8294" font-family="Arial,sans-serif" font-size="10" font-weight="700">TRACK</text><text x="648" y="219" fill="#2A332D" font-family="Arial,sans-serif" font-size="15" font-weight="700">DeepSORT</text><text x="648" y="248" fill="#6B766F" font-family="Arial,sans-serif" font-size="11.5">Associate detections across frames.</text><circle cx="836" cy="179" r="4" fill="#5F8294"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D7DED8"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#4E7D64"/><text x="936" y="184" fill="#4E7D64" font-family="Arial,sans-serif" font-size="10" font-weight="700">EVENTS</text><text x="936" y="219" fill="#2A332D" font-family="Arial,sans-serif" font-size="15" font-weight="700">Motion checks</text><text x="936" y="248" fill="#6B766F" font-family="Arial,sans-serif" font-size="11.5">Display configured speed and direction events.</text><circle cx="1124" cy="179" r="4" fill="#4E7D64"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#C18A3A"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#5F8294"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#6B766F" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. Open architecture.html for interactive stage details.</text></svg>